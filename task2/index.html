<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sesion2</title>
</head>
<body>
    <fieldset>
        <legend>personal information</legend>
     <form method="post">
        <div>
            <label>first name</label>
            <input type="text" required autofocus placeholder="enter your first name" name="firstName" >
        </div>
        <div>
            <label>last name</label>
            <input type="text" placeholder="enter your last name" required name="lastName">
        </div>
        <div>
            <label>email</label>
            <input type="email" name="email" id="email" >
        </div>
        <div>
            <label>password</label>
            <input type="password"  name="password" placeholder="enter your password">
        </div>
        <div>
            <label>gender</label>
            <input type="radio" value="male" name="gender">
            <label>male</label>
            <input type="radio" value="female" name="gender">
            <label>female</label>
        </div>
        <div>
            <label>courses</label>
            <input type="checkbox" value="html" name="courses">
            <label>html</label>
            <input type="checkbox" value="css" name="courses">
            <label>css</label>
            <input type="checkbox" value="react" name="courses">
            <label>react</label>
        </div>
        <div>
        <select name="track" >
            <option disabled selected name="track">choose your track</option>
            <option value="frontend">frontend</option>
            <option value="backend">backend</option>
            <option value="network">network</option>
        </select>
        </div>
        <div>
            <label>age</label>
            <input type="number" max="10" min="3">
        </div>
        <div>
            <label>phone</label>
            <input type="text" name="text" maxlength="11" minlength="11" placeholder="enter your phone" pattern="[0-9]01(2|5|1){8}" title="enter only numbers">
        </div>
        <div>
            <label>contact page</label>
            <input type="url" name="url" id="url" placeholder="enter url">
        </div>
        <div>
            <input type="color">
            <input type="datetime-local" name="date">
            <input type="range" name="range" max="100" min="20">
        </div>
        <div>
            <label>upload images</label>
            <input type="file" name="image" accept=".png" multiple>
        </div>
        <div>
            <label>choose your city</label>
            <input type="text" id="city" name="city" list="cities">
            <datalist id="cities">
                <option value="elmansoura"></option>
                <option value="nasr"></option>
                <option value="cairo"></option>
                <option value="alex"></option>
            </datalist>
        </div>
        <div>
            <textarea cols="30" rows="10"> any comment</textarea>
        </div>
        <div>
            <input type="submit" value="submit" name="submit">
            <input type="reset"  value="clear" name="clear">
        </div>
     </form>
    </fieldset> 
</body>
</html>
